version: "3.9"

services:
  web:
    build: .
    container_name: dombivli_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: dombivli_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pashupra_homes
      MYSQL_USER: pashupra_homes
      MYSQL_PASSWORD: Mumbai@2050
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
